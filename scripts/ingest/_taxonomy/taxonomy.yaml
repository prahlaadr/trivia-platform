# Pyaar Project Trivia — canonical taxonomy.
# Source of truth: docs/category-taxonomy.md
# Used by: scripts/ingest/init_schema.py to seed the DB.
# 15 categories × 50 subcategories.
# One subcategory per category is marked is_catchall: true — that's where
# rows from upstream sources land before keyword rules refine them.

